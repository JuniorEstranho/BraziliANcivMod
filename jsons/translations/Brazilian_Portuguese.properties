 /// Canudos ///
The great Antônio - the messianic figure. Canudos was a small settlement that existed around 1890, bringing together Indigenous people, the destitute, freed enslaved people, and, above all, the inhabitants of the sertão. Yet our success drew the attention of powerful elites who devastated our settlement - but nothing will ever erase our struggle! = Ó grande Antônio - a figura messiânica. Canudos foi um pequeno arraial que existiu entre 1890, abrigando consigo indígenas, os desabrigados, escravizados libertos e principalmente os sertanejos. Nosso sucesso chamou a atenção de poderosos da elite que devastaram o arraial - mas nada pode apagar nossa luta!
Antônio Conselheiro! Will you manage to create a great settlement that will last for years? Will you manage to help us overcome the challenge of time? = Antônio Conselheiro! Você conseguirá criar um grande povoado que perdure por anos? Conseguirá nos ajudar a superar o desafio do tempo?

For the sake of faith and the honor of the poorest and weakest, you will be ordered to leave! = Pela fé e honra dos mais pobres, você será obrigado a se retirar!
First of all,understand that you are attacking a poor and defenseless people, right? = Antes de tudo, você compreende que está atacando pessoas pobres e indefesas, não é?
Keep going, nobody wants to see how it ends. = Continue com isso, ninguém quer ver o que isso vai nós levar.
Ah yes, it's done. You did it. Good luck.= A sim, acabou. Você conseguiu. Parabéns.
Blessings to you and your people. I am Antônio Conselheiro, spiritual leader of this suffering people. = Bençãos a ti e teu povo. Eu sou Antônio Conselheiro, líder espiritual deste povoado sofrido.
I am certain that tomorrow's blessings will materialize by accepting this agreement. = Tenho certeza de que as bençãos de amanhã irão se concretizar ao aceitar este acordo.

 /// Grão Pará ///
Eduardo Angelim! For a long time, the province of Grão-Pará suffered under the depredations of the arrogant and exploitative elites of the Brazilian Regency; this set the stage for the Cabanos revolt - or the 'Cabanagem' as it came to be known - which was the largest popular uprising in Brazilian history. Many betrayals and massacres took place during the revolt, but in the end, we were defeated and slaughtered by those who had sworn to ensure our safety. = Eduardo Angelim! Por muito tempo, a província do Grão-Pará sofreu com a decadência vinda das elites arrogantes e exploradora da Regência Brasileira, isso culminou para a revolta dos cabanos - ou a 'Cabanagem' como foi conhecida - a maior revolta popular na história brasileira. Muitas traições e massacres ocorreram durante a revolta mas no fim, fomos derrotados e massacrados por aqueles que juravam nós proteger.
We are weary of this suffering, Angelim! Please, give us the future we were promised! Will our independent province triumph over the test of time? = Estamos cansado deste sofrimento, Angelim! Por favor, traga o futuro que nós prometeu! Nossa província independente irá triufar sobre o teste do tempo?

Riverine Guerrilla Warfare = Guerrilhas Fluviais
You are an imminent threat; I will not wait for your first attack. = Você é uma ameaça iminente, não esperarei pelo seu primeiro ataque.
Foolishly, we are only here because of our struggle. We won't surrender without fight. = Tolice, estamos aqui apenas por causa de nossa força. Não cairemos sem lutar.
Accepting this aggression is not an option. = Aceitar essa agressão não é uma opção.
Cowardice - you attacked the weak for your own gain. You are nothing more than a glorified tyrant! = Covardia - atacou os mais fracos para seu próprio benefício. Você não passa de um tirano glorificado!
Did you come here to join the fight or to fight against us? = Veio se juntar a nós ou lutar contra?
I'm restless thinking about it, but I want to see if you'll like it. = Eu estou pensando nisso a um tempo mas preciso ver se você gostaria disso.
I don't think you're our sworn enemy, then; perhaps you could accept. = Eu não te considero o meu maior inimigo, então seria gentil de sua parte aceitar.

 /// Juliana ///
Equality, Freedom and Humanity = Igualdade, Liberdade e Humanidade
It's getting harder and harder to put up with you. I'll have to destroy you for the good of the Republic! = Está se tornando impossível aturar você. Eu irei destruí-lo pelo bem da república!
This will not be the end. We will resist! = Não será nosso fim. Iremos resistir!
You're confusing my respect with fear! = Você confundiu o meu respeito com temor!
You defeated me, but you will be haunted by the tears of your victims! = Você me derrotou mas será assombrado pelas lamentações das suas vítima!
Good morning, I am David Canabarro, General and leader of the Juliana Republic. We seek stability with our neighbors. = Bom dia, eu sou David Canabarro, General e líder da República Juliana. Buscamos estabilidade com nossos vizinhos.
It will certainly be mutually beneficial to both us. = Irá nós beneficiar mutualmente se você aceitar.

 /// Malês ///
American Levant = Levante Americano
I heard that some of my men are rebelling near your border, is that true? = Escutei rumores de que meus homens estão se rebelando nad suas fronteiras, isso é verdade?
If that's the case, we'll go to war; we will not be slaves again! = Se este é o caso, iremos a guerra. Não seremos escravizados novamente!
I will have to take drastic measures. = Terei que tomar medidas drásticas 
With this fate, I have only one wish - that God forgives you for your choices. = Com este fim, eu só tenho um pedido - que Deus lhe perdoe por suas escolhas.
May God be with you, I am Pacífico Licutan. The Malês wish you peace. = Que Deus esteja contigo, eu sou Pacífico Licutan. Os Malês lhe desejam paz.
This needs to be possible. We'll make sure you don't regret it. = Isso precisa ser possível. Garanto que não irá se arrepender.

 /// New Holland ///
New Holland = Nova Holanda
Letter of Marque = Cartas de Corso
Maurice of Nassau = Maurício de Nassau
You're not the same as knew, peace is not a option now. = Você não é o mesmo que eu conheci, paz não é mais uma opção agora.
We will not surrender! = Não iremos nós render!
We are not afraid, you are wasting time! = Não temos medo de você, que perda de tempo!
The Dutch West India Company isn't going to like this news... = A Companhia das Índias Ocidentais Holandesas não vão gostar das novas notícias...
Welcome, You're in The New Netherlands. I'm Johan Maurits van Nassau-Siegen, the New Holland Governor. = Bem-vindo, você está na Nova Holanda. Eu sou Maurício de Nassau, O Governador da Nova Holanda.
Come here, we are talking about you. = Vem aqui, estávamos falando sobre você.

 /// Palmares ///
Welcome to Angola Janga! During the colonial era, many enslaved Africans - alongside indigenous people and deserters - joined forces to defend themselves against the expansion of the feared Bandeirantes, thereby forming the 'Quilombo dos Palmares'. After numerous attacks, the great leader Ganga Zumba attempted to broker peace with the colonists - a move opposed by many within the quilombo - but he was mysteriously assassinated, reigniting the revolt and ultimately leading to the capture of Zumbi and the fall of the quilombo. = Bem-vindo a Angola Janga! Durante o período colonial, muitos africanos escravizados junto com indígenas e desertores, uniram forças para se defender da expansão dos ferozes Bandeirantes, com a união fundando o 'Quilombo dos Palmares'. Depois de inúmeros ataques, o grande líder Ganga Zumba aceitou o acordo de paz - um acordo que muitos do quilombo não concordavam - mas ele foi misteriosamente assasinado, o que intensificou a revolta onde levou a captura de Zumbi e a queda do Quilombo dos Palmares.
Zumbi! We no longer fear oppression. Shall we safeguard this small space for our people? Shall we triumph over the invaders? = Zumbi! Não temos mais medo da opressão. Poderá proteger este refúgio para o seu povo? Poderemos triufar sobre os invasores?

Refuge = Refúgio
I couldn't help but notice your audacity in turning against us. Quilombolas we will destroy the enemy! = Não pude deixar de notar a sua audácia ao se voltar contra nós. Quilombolas, nós destruiremos o inimigo!
These lands will never be yours. You will achieve nothing with this aggression! = Essas terras nunca serão suas. Você não ganhará nada com essa agressão!
I'm interested in what you're going to do after that. = Estou interessado no que você vai fazer depois disso
Your resentment echoes in the destroyed ruins of the mocambos. You may have won this war in name, but I won it in spirit! = O seu ressentimento ecoa pelas ruínas destruídas dos mocambos. Você ganhou está guerra, no nome, eu ganhei no espírito.
Welcome to the Quilombo dos Palmares, where enslaved people and deserters find refuge amidst the chaos. Tell me about yourself. = Bem-vindo ao Quilombo dos Palmares, aqui é onde os escravizados e desertores buscam refúgio em meio ao caos. Conte mais sobre você.
I've been wondering if this is possible between our peoples. = Seria maravilhoso se isso fosse possível entre nossos povos.

 /// Piratini ///
Charisma = Carisma
You wasted my time with your disloyal agreements. I don't need nothing this! Let's make a true agreement, ha ha ha. = Você me fez perder tempo com esses acordos infundados. Eu não preciso de nada disso! Vamos fazer um acordo de verdade, ha ha ha.
You disloyal fool, you don't wanna see what my army can do with your pathetic cities! = Seu tolo enganoso, você não quer ver o que meu exército pode fazer com suas cidades patéticas!
I don't need the opinion of a backstabber. = Não preciso da opinião de um traidor.
Maybe if I had more luck... = Talvez se eu tivesse mais sorte...
Greetings! We are so exciting to meeting you. I am Bento Gonçalves, the Great Major from Brazilian South Army or now Piratini Republic Army. = Saudações, é um prazer conhecê-lo, eu sou Bento Gonçalves, o Grande Major do exército do sul do Brasil, ou Exército da República do Piratini, agora.
May you agree with me. = Talvez você concorde comigo.

 /// The Tupi ///
The Tupi = Os Tupis
Peabiru Trail = Caminho de Peabiru
We will not accept all your aggressions. The Tupi people will triumph over your fallen men! = Não aceitamos suas ofensivas. Os Tupis triunfará sobre os seus homens caídos!
Coward! You won't gain anything from this. Our people are not known for giving up! = Covarde! Você não ganhará nada com isso. Nosso povo não é conhecido por se render!
So get out of here! = Então saia daqui!
Monster, I curse you, I curse your children, I curse your grandchildren! = Monstro, Você é amaldiçoado, seus filhos são amaldiçoados e até os seus netos são!
The Tupi people welcome you. I am Cunhambebe, The Tamoios Chieftain tribe. = Os Tupis te dão as boas vindas. Eu sou Cunhambebe, o Cacique da Tribo dos Tamoios
